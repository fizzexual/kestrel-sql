[package]
name = "kestrel-sql"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Experimental embedded SQL engine for exact live range aggregates"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1.5"

[lib]
name = "kestrel_sql"

[[bin]]
name = "kestrel"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
