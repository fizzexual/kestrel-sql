[package]
name = "kestrel-sql"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Experimental embedded SQL engine for exact live range aggregates"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1.5"
sha2 = "0.10.9"
getrandom = "0.3"

[lib]
name = "kestrel_sql"

[features]
# Test-only publication failures. Default builds contain no environment hooks.
fault-injection = []

[[bin]]
name = "kestrel"
path = "src/main.rs"

[[example]]
name = "publication_fault_probe"
required-features = ["fault-injection"]

[[example]]
name = "live_retry_probe"
required-features = ["fault-injection"]

[[example]]
name = "source_fault_probe"
required-features = ["fault-injection"]

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
