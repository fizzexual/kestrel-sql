[package]
name = "kestrel-checkpoint-compression-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
zstd-safe = { version = "=7.2.4", default-features = false, features = ["std"] }
crc32fast = "=1.5.0"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
