name: Verify
on: [push, pull_request]
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - run: cargo test --release --locked --features fault-injection
  # The oldest compiler Cargo.toml promises (rust-version).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo test --release --locked
  # Known vulnerabilities in the locked dependencies (RustSec advisory database).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  # Power cuts on a file system that drops every byte that was not fsynced (benchmarks/lazyfs/).
  lazyfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kestrel-lazyfs benchmarks/lazyfs
      - run: docker run --rm --privileged -v "$PWD:/src:ro" kestrel-lazyfs bash /src/benchmarks/lazyfs/run.sh 60
